<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Contatos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-address-book"></i> Minha Agenda de Contatos</h1>
        </div>
    </header>
    <main>
        <div class="container">
            <section class="form-section">
                <form id="contactForm">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" placeholder="Nome" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="phone" placeholder="Telefone" required>
                    </div>
                    <button type="submit">
                        <i class="fas fa-plus"></i> Cadastrar
                    </button>
                </form>
            </section>
            <section class="table-section">
                <table>
                    <thead>
                        <tr>
                            <th><i class="fas fa-user"></i> Nome</th>
                            <th><i class="fas fa-phone"></i> Telefone</th>
                        </tr>
                    </thead>
                    <tbody id="contactTableBody"></tbody>
                </table>
            </section>
        </div>
    </main>
    <footer>
        <div class="container">
            <p>&copy; 2025 - By Éber Lindo</p>
        </div>
    </footer>
    <div id="popup" class="hidden">
        <div class="popup-content">
            <i class="popup-icon fas fa-check-circle"></i>
            <h2 id="popup-title">Sucesso!</h2>
            <p id="popup-text">Seu contato foi adicionado com sucesso.</p>
            <button id="popup-close">Ok</button>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
