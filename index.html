<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora de medias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:ital,wght@0,100..900;1,100..900&family=Protest+Strike&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./main.css">
</head>
<body>
<div class="container">
    <header>
        <img src="./logo.png" alt="logo">
        <h1>Calculadora de Média</h1>
    </header>
    <form id="form-atividade">
        <input type="text" id="nome-atividade" required placeholder="Nome da prova" />
        <input type="number" id="nota-atividade" required placeholder="Nota da prova" min="0" max="10" /> 
        <button type="submit"> Adicionar +</button>
    </form>
    <table cellspacing="0">
        <thead>
            <tr>
                <th>Nome da prova</th>
                <th>
                    Nota da prova
                </th>
                <th> Aprovado ?</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
        <tfoot>
            <tr>
                <td > Media final</td>
                <td id="media-final-valor">---</td>
                <td id="media-final-resultado"> ---</td>
            </tr>
        </tfoot>
    </table>
</div>
<script src="./main.js"></script>

</body>
</html>
